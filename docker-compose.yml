services:
  news-classifier-api:
    build: ./src/api
    ports:
      - "8081:8080"
    restart: always

  evaluation:
    build: ./src/evaluation
    depends_on:
      - news-classifier-api

  aiops-agent-monitor:
    build: ./src/aiops_agent_monitor
    ports:
      - "8005:8005"
    volumes:
      - ./tests:/app/tests:ro
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME}
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=AIOps Monitor Agent Internal Runs
      - POSTGRES_HOST=${POSTGRES_HOST} 
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-monolith}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-huggingface-tei}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - HUGGINGFACE_TEI_URL=${HUGGINGFACE_TEI_URL}
      - ENABLE_RAG_TOOL=${ENABLE_RAG_TOOL:-false}
    depends_on:
      - prometheus
      - loki
      - news-classifier-api
      - postgres
      - tei
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deployment/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: always
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./deployment/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_JSON_ENABLED=true
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - prometheus
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./deployment/loki/loki-config.yaml:/etc/loki/config.yaml
    command: -config.file=/etc/loki/config.yaml
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./deployment/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: always

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  # Text Embeddings Inference (Hugging Face)
  # FREE alternative to OpenAI embeddings
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    container_name: tei
    ports:
      - "8082:8080"
    command: --model-id BAAI/bge-small-en-v1.5 --port 8080
    volumes:
      - tei_data:/data
    restart: always

  # Sample Data Loader (runs once to populate knowledge base)
  data-loader:
    build:
      context: .
      dockerfile: ./deployment/postgres/Dockerfile.loader
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HUGGINGFACE_TEI_URL=${HUGGINGFACE_TEI_URL}
      - LOAD_SAMPLE_DATA=${LOAD_SAMPLE_DATA:-false}
    depends_on:
      - postgres
      - tei
    restart: "no"  # Run once and exit
    profiles:
      - tools  # Only run when explicitly requested

volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  postgres_data: {}
  tei_data: {}