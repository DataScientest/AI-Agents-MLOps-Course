services:
  # --- Edge Services ---
  api-gateway:
    container_name: api-gateway
    build: ./src/api_gateway
    ports:
      - "8000:8000"
    environment:
      - AGENT_CORE_SERVICE_URL=http://aiops-agent-monitor:8005/diagnose_alert
    depends_on:
      aiops-agent-monitor:
        condition: service_healthy
    restart: always

  # --- Agent Layer ---
  aiops-agent-monitor:
    container_name: aiops-agent-monitor
    build: ./src/aiops_agent_monitor
    ports:
      - "8005:8005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_NAME=${GROQ_MODEL_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=AIOps-Agent-Core
      - POSTGRES_DB_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - DEPLOYMENT_MODE=microservices
      - PROMETHEUS_TOOL_SERVICE_URL=http://prometheus-tool-service:8001
      - LOKI_TOOL_SERVICE_URL=http://loki-tool-service:8002
      - GRAFANA_TOOL_SERVICE_URL=http://grafana-tool-service:8003
      - SYSTEM_TOOL_SERVICE_URL=http://system-tool-service:8004
      - KNOWLEDGE_BASE_SERVICE_URL=http://knowledge-base-service:8006
    depends_on:
      - prometheus-tool-service
      - loki-tool-service
      - grafana-tool-service
      - system-tool-service
      - knowledge-base-service
      - postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Tool Services (Microservices) ---
  prometheus-tool-service:
    build: ./src/tool_services/prometheus_tool
    ports:
      - "8001"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - prometheus
    restart: always

  loki-tool-service:
    build: ./src/tool_services/loki_tool
    ports:
      - "8002"
    environment:
      - LOKI_URL=http://loki:3100
    depends_on:
      - loki
    restart: always

  grafana-tool-service:
    build: ./src/tool_services/grafana_tool
    ports:
      - "8003"
    environment:
      - GRAFANA_URL=http://grafana:3000
    depends_on:
      - grafana
    restart: always

  system-tool-service:
    build: ./src/tool_services/system_tool
    ports:
      - "8004"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
    depends_on:
      - prometheus
    restart: always

  knowledge-base-service:
    build: ./src/tool_services/knowledge_base_service
    ports:
      - "8006"
    environment:
      - POSTGRES_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - HUGGINGFACE_TEI_URL=${HUGGINGFACE_TEI_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - RAG_TOP_K=${RAG_TOP_K}
      - RAG_SIMILARITY_THRESHOLD=${RAG_SIMILARITY_THRESHOLD}
    depends_on:
      - postgres
      - tei
    restart: always

  # --- Data & Infrastructure Layer ---
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./deployment/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./deployment/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./deployment/loki/loki-config.yaml:/etc/loki/config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml
    restart: always

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.2
    platform: linux/amd64
    container_name: tei
    ports:
      - "8082:8080"
    command: --model-id BAAI/bge-small-en-v1.5 --port 8080
    restart: always

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./deployment/promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: always

  news-classifier-api:
    build: ./src/api
    ports:
      - "8083:8080"
    restart: always

  # Sample Data Loader (runs once to populate knowledge base)
  data-loader:
    build:
      context: .
      dockerfile: ./deployment/postgres/Dockerfile.loader
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - HUGGINGFACE_TEI_URL=${HUGGINGFACE_TEI_URL}
      - LOAD_SAMPLE_DATA=${LOAD_SAMPLE_DATA:-false}
    depends_on:
      - postgres
      - tei
    restart: "no"

volumes:
  postgres_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
