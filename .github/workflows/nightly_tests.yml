name: Nightly Performance & SLA Tests

# Slow tests - run nightly or on explicit request
on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:  # Allow manual trigger from GitHub UI
  push:
    branches: [ main, develop ]
    # Only run if commit message contains the trigger
    paths-ignore:
      - '**'  # Ignore all paths by default

jobs:
  performance-tests:
    name: Performance & SLA Tests
    runs-on: ubuntu-latest
    # Run on schedule, manual trigger, or commits with [run-performance]
    if: >
      github.event_name == 'schedule' || 
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[run-performance]')
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    - name: Create .env file
      run: |
        cp .env.example .env || echo "GROQ_API_KEY=test" > .env

    - name: Start services
      run: |
        docker compose up -d
        sleep 30

    - name: Wait for services to be healthy
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'

    - name: Run SLA Tests
      run: pytest tests/sla/ -v
      continue-on-error: true

    - name: Run Performance Tests  
      run: pytest tests/performance/ -v
      continue-on-error: true

    - name: Collect logs on failure
      if: failure()
      run: |
        docker compose logs > docker-logs.txt
        cat docker-logs.txt

    - name: Cleanup
      if: always()
      run: docker compose down -v
