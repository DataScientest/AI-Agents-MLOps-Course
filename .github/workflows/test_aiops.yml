name: AIOps Agent Production Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check code formatting with black
      run: |
        black --check src/ tests/ || echo "Code formatting issues found (non-blocking)"
      continue-on-error: true

    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/ || echo "Import sorting issues found (non-blocking)"
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov requests prometheus_client

    - name: Run Unit Tests with Coverage
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Validate Docker Compose
      run: |
        docker compose config > /dev/null
        echo "✅ Docker Compose configuration is valid"

    - name: Check for required files
      run: |
        required_files=(
          "docker-compose.yml"
          "Makefile"
          ".env.example"
          "scripts/run_tests.sh"
          "tests/conftest.py"
        )
        
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ Found: $file"
          else
            echo "❌ Missing: $file"
            exit 1
          fi
        done

    - name: Validate Test Structure
      run: |
        test_dirs=(
          "tests/unit"
          "tests/integration"
          "tests/e2e"
          "tests/chaos"
          "tests/sla"
          "tests/performance"
        )
        
        for dir in "${test_dirs[@]}"; do
          if [ -d "$dir" ]; then
            echo "✅ Found: $dir"
          else
            echo "❌ Missing: $dir"
            exit 1
          fi
        done

  integration-tests:
    name: Integration Tests (Docker Required)
    runs-on: ubuntu-latest
    needs: [unit-tests, validation]
    # Only run on main branch or when explicitly requested
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[run-integration]')
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    - name: Create .env file
      run: |
        cp .env.example .env || echo "GROQ_API_KEY=test" > .env

    - name: Start services
      run: |
        docker compose up -d
        sleep 30  # Wait for services to be ready

    - name: Wait for services to be healthy
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'

    - name: Run Integration Tests
      run: |
        pytest tests/integration/ -v

    - name: Run E2E Tests
      run: |
        pytest tests/e2e/ -v
      continue-on-error: true

    - name: Collect logs on failure
      if: failure()
      run: |
        docker compose logs > docker-logs.txt
        cat docker-logs.txt

    - name: Cleanup
      if: always()
      run: |
        docker compose down -v

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, validation]
    if: always()
    steps:
    - name: Check test results
      run: |
        echo "🎯 Test Summary:"
        echo "  - Linting: ${{ needs.lint.result }}"
        echo "  - Unit Tests: ${{ needs.unit-tests.result }}"
        echo "  - Validation: ${{ needs.validation.result }}"
