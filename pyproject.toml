[project]
name = "ai-agents-mlops-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.3.9",
    "langchain-core==1.4.7",
    "langchain-groq==1.1.3",
    "langchain-openai==1.3.2",
    "langgraph==1.2.5",
    "numexpr==2.11.0",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/aiops_agent_monitor"]
addopts = "-m 'not live'"
markers = ["live: requires a real LLM API key (disabled by default, run with -m live)"]
